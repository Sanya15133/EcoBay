{% extends 'layout.html' %}

{% block content %}
    <h2>Item</h2>
     {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
    <div id="main">
        { % if item %}
        <p>{{ item.name }}</p>
        <p> {{ item.description }}</p>
        <p>{{ item.amount }}</p>
        <p>{{ item.is_active }}</p>
        <p>{{ item.user }}</p>
        <img>
    </div>
    {% endif %}
{% endblock %}
