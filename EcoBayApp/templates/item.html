{% extends 'layout.html' %}

{% block content %}
    <h2>Item</h2>
     {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
    <div id="main">
        { % if item %}
        <p>{{ item.name }}</p>
        <p> {{ item.description }}</p>
        <p>{{ item.amount }}</p>
        <p>{{ item.is_active }}</p>
        <p>{{ item.user }}</p>
        <img src={{ item.image_url }} alt={{ item.name }}>
        {% if user.is_authenticated %}
        <form action="{% url 'make_offer' %}">
        <label for="bid-amount"></label>
        <input name="bid-amount" type='number' placeholder="{{ item.amount }}"></input>
        <button type="submit">Make Offer</button>
        </form>
        {% endif %}
    </div>
    {% endif %}
{% endblock %}
