{% extends 'layout.html' %}

{% block content %}
    <h2>Home</h2>
     {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
    <div class="main-div">
    <p>Current skills</p>
    <div class="skill-div">
    </div>
    <p>Current Items</p>
    {% if items %}
     {% for item in items %}
        <div class="item-div">
            <p>{{ item.name }}</p>
    </div>
    </div>
{% endblock %}
