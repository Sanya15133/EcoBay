{% extends 'layout.html' %}

{% block content %}
    <h2>Add Item</h2>
    <div class="main-div">
     <form method='post' action="{% url 'add_item'  %}">
        {% csrf_token %}
        <p>
        <label for="name">Item</label><input name='name' type="text">
        </p>
        <p>
        <label for="description">Description</label><input name='description' type="text">
        </p>
        <p>
        <label for="price">Price</label><input name='price' type="number">
        </p>
        <p>
        <label for="image">Image link</label><input name="image" type="url">
        </p>
        <p>
        <label for="category">Category</label>
        <select name="category" type="text">
        <option value="">Select Category</option>
        {% for category in categories %}
        <option value="{{ category.id }}" name="{{ category_id }}">{{ category.name }}</option>
        {% endfor %}
        </select>
        </p>
        <button type="submit">Add</button>
     </form>
    </div>
{% endblock %}
