{% extends 'layout.html' %}

{% block content %}
<div class="form-page">
    <div class="main-div form-card">

        <p class="event-eyebrow">COMMUNITY MARKETPLACE</p>
        <h2 class="form-title">Add Item</h2>
        <p class="form-subtitle">
            List an item for your neighbours to discover.
        </p>

        <form method="post" action="{% url 'add_item' %}">
            {% csrf_token %}

            <label for="name">Item name</label>
            <input
                id="name"
                name="name"
                type="text"
                placeholder="e.g. Garden tools"
                required
            >

            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                placeholder="Describe your item..."
                required
            ></textarea>

            <label for="price">Price (£)</label>
            <input
                id="price"
                name="price"
                type="number"
                min="0"
                step="0.01"
                placeholder="e.g. 15.00"
                required
            >

            <label for="image">Image link</label>
            <input
                id="image"
                name="image"
                type="url"
                placeholder="https://example.com/image.jpg"
                required
            >

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                {% for category in categories %}
                <option value="{{ category.id }}">
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>

            <button type="submit" class="form-submit-btn">
                Add item
            </button>
        </form>

    </div>
</div>
{% endblock %}
