{% extends 'layout.html' %}

{% block content %}
    <h2>Add Item</h2>
    <div class="main-div">
     <form method="{% url 'add_item'  %}">
        <label for="name">Item</label><input name='name' type="text">
        <label for="description">Description</label><input name='description' type="text">
        <label for="date">Date</label><input name='date' type="date">
        <label for="price">Price</label><input name='price' type="number">
        <label for="bid">Bids</label><input name='bid' type="number">
        <label for="image">Image link</label><input name="image" type="url">
        <button type="submit">Add</button>
     </form>
    </div>
{% endblock %}
