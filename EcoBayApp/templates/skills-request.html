{% extends 'layout.html' %}

{% block content %}
    <h2>Skill Request</h2>
     {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
    <div class="main-div">
     <form method="post" action="{% url 'request_skill'  %}" >
        <label for="name">Skill</label><input name="name">
        <label for="description">Description</label><input name="description">
        <label for="date">Date</label><input name="date">
        <label for="completed">Is Complete</label><input name="completed">
        <button type="submit">Submit Request</button>
     </form>
    </div>
{% endblock %}
