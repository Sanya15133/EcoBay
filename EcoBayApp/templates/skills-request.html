{% extends 'layout.html' %}

{% block content %}

     {% if error %}

    {% endif %}
    <div class="main-div">
     <form method="POST">
        <label>Skill</label><input>
        <label>Description</label><input>
        <label>Date</label><input>
        <label>Is Complete</label><input>
        <button type="submit">Submit Request</button>
     </form>
    </div>
{% endblock %}
