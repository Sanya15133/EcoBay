{% extends 'layout.html' %}

{% block content %}
<div class="form-page">
    <div class="main-div form-card">

        <p class="event-eyebrow">COMMUNITY SKILLS</p>
        <h2 class="form-title">Add Skill</h2>
        <p class="form-subtitle">
            Share your skills and help your neighbours.
        </p>

        <form method="post" action="{% url 'add_skill' %}">
            {% csrf_token %}

            <label for="name">Skill name</label>
            <input
                id="name"
                name="name"
                type="text"
                placeholder="e.g. Gardening or DIY"
                required
            >

            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                placeholder="Describe the skill you can offer..."
                required
            ></textarea>

            <label for="amount">Amount (£)</label>
            <input
                id="amount"
                name="amount"
                type="number"
                min="0"
                step="0.01"
                placeholder="Enter amount"
                required
            >

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                {% for category in categories %}
                <option value="{{ category.id }}">
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>

            <button type="submit" class="form-submit-btn">
                Add skill
            </button>
        </form>

    </div>
</div>
{% endblock %}
