{% extends 'layout.html' %}

{% block content %}
    <h2>Add Skill</h2>
    <div class="main-div">
     <form method='post' action="{% url 'add_skill'  %}">
        {% csrf_token %}
        <p>
        <label for="name">Skill</label><input name='name' type="text">
        </p>
        <p>
        <label for="description">Description</label><input name='description' type="text">
        </p>
        <p>
        <label for="date">Date</label><input name='date' type="date">
        </p>
        <p>
        <label for="amount">Amount</label><input name='amount' type="number">
        </p>
        <p>
        <label for="image_url">Image link</label><input name='image_url' type="url">
        </p>
        <p>
        <label for="category">Category</label>
        <select name="category" type="text">
        <option value="">Select Category</option>
        {% for category in categories %}
        <option value="{{ category.id }}">{{ category.name }}</option>
        {% endfor %}
        </select>
        </p>
        <button type="submit">Add</button>
     </form>
    </div>
{% endblock %}
